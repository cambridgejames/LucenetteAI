name: ✨ 功能请求（Feature Request）
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        设计层面的新想法请优先走 RFC 提案流程（docs/rfcs/ 目录），本模板用于具体功能点的请求。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现状存在什么问题或空白？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望怎么解决？影响哪些模块（docs/02-modules/）或契约（docs/01-contracts/）？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
    validations:
      required: false
