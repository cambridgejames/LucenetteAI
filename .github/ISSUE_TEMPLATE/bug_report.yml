name: 🐛 问题反馈（Bug Report）
description: 报告文档或代码中的错误、缺陷
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供完整信息，便于定位问题。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？预期是什么？
      placeholder: 清晰描述问题现象与预期行为
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      description: 问题出现在哪里？
      options:
        - 设计文档（docs/02-modules/）
        - 契约（docs/01-contracts/）
        - 全局文档 / 工作包看板 / 流程文档
        - 代码（原型测试脚本）
        - 其他
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何复现？若是文档问题，请给出具体章节位置或链接。
      placeholder: |
        1. ...
        2. ...
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、日志、相关链接等
    validations:
      required: false
